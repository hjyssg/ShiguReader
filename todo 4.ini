
## 分析结果

### Task 1：重复代码

读完 `read.tsx`、`video.tsx`、`audio.tsx`、`read-waterfall.tsx`、`archive.tsx` 后，发现以下重复模式：

**1. Reader Toolbar（高度重复）**
`read.tsx`、`video.tsx`、`audio.tsx` 三个页面都有完全相同的 `<nav className="reader-toolbar">` + `PathBreadcrumb` 结构，传的 props 几乎一模一样（`homeLinkClassName`、`homeIconClassName`、`dirItemClassName` 等 8 个相同 props）。

**2. Reader Meta Bar（底部信息栏）**
`video.tsx` 和 `audio.tsx` 有完全相同的底部 meta bar（mtime + size）。`read.tsx` 是扩展版（多了 authors/cosers/tags）。

**3. Parent List Query（获取 mtime/size）**
`read.tsx`、`video.tsx`、`audio.tsx` 都有相同的 `useQuery(["reader-parent-list", parentPath])` 逻辑来获取文件元数据。

**4. Loading Skeleton 模式**
`read.tsx`、`read-waterfall.tsx`、`archive.tsx`、`read-mobile.tsx` 都有相同的 `<div className="space-y-6"><Skeleton .../><Skeleton .../></div>` 骨架屏。

**5. `read-waterfall.tsx` 的 PathBreadcrumb**
waterfall 页面用的是简化版 PathBreadcrumb，和其他 reader 页面风格不一致（没有 toolbar 包裹，没有统一样式）。

---

### Task 2：ZIP 音频自动进入 Audio Mode

**现状：** 打开 ZIP → `archive.tsx` 展示条目 → 点击音频条目 → 跳转到独立的 `/audio` 页面

**目标：** 把 audio 播放器变成 `read.tsx` 的一个 mode，ZIP 里有音频时自动进入

---

## 实施计划

### Task 1 重构

1. **提取 `useParentMeta` hook** — 封装 parent list query + mtime/size 计算逻辑
2. **提取 `ReaderToolbar` 组件** — 封装 toolbar + PathBreadcrumb，接受 `sourcePath`、`fileName`、`extraCrumbs`、`actions` 等 props
3. **提取 `ReaderMetaBar` 组件** — 封装底部 meta bar，接受 `mtime`、`size`、`right` slot 等 props
4. **提取 `ReaderLoadingSkeleton` 组件** — 统一骨架屏
5. **更新 `read.tsx`、`video.tsx`、`audio.tsx`** 使用新组件
6. **修复 `read-waterfall.tsx`** 使用 `ReaderToolbar` 保持风格一致

### Task 2 Audio Mode

1. **给 `/read` 路由添加 `mode?: "image" | "audio"` 参数**
2. **在 `read.tsx` 里添加 audio mode 分支** — 复用 `audio.tsx` 的播放器 UI（封面图 + 播放列表 + AudioPlayer），但集成在 reader-page 布局里
3. **`archive.tsx` 自动检测** — 当 archive 的 `audio_count > 0` 且 `image_count === 0` 时，"Open Reader" 按钮跳转到 `/read?path=...&mode=audio`；archive 条目里的音频链接也改为 `/read?path=...&mode=audio&page=audioIndex`
4. **`read.tsx` 自动跳转** — 加载 archive 数据后，如果没有图片但有音频，自动 redirect 到 audio mode（防止用户直接访问 `/read` 时看到空页面）

