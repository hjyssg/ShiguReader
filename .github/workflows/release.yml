name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅构建打包，不创建 GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "手动创建 Release 时使用的 tag（例如 v0.1.0-test1）"
        required: false
        type: string
        default: ""

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend (TypeScript → JS)
        working-directory: backend
        run: |
          npm ci
          npx tsc

      - name: Install backend production dependencies only
        working-directory: backend
        run: npm ci --omit=dev

      - name: Download Node.js portable (for bundling)
        shell: pwsh
        run: |
          $NODE_VERSION = "22.14.0"
          $url = "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          Write-Host "Downloading Node.js portable from $url"
          Invoke-WebRequest -Uri $url -OutFile "node-portable.zip"
          Expand-Archive -Path "node-portable.zip" -DestinationPath "node-portable-extracted"
          # Copy just node.exe to a staging location
          Copy-Item "node-portable-extracted\node-v${NODE_VERSION}-win-x64\node.exe" -Destination "node.exe"

      - name: Assemble release package
        shell: pwsh
        run: |
          $version = "${{ env.PACKAGE_VERSION }}"
          $pkgName = "ShiguReader-${version}-windows-x64"
          $pkg = "release_pkg\$pkgName"

          # Create directory structure
          New-Item -ItemType Directory -Force -Path "$pkg\backend\dist"
          New-Item -ItemType Directory -Force -Path "$pkg\backend\node_modules"
          New-Item -ItemType Directory -Force -Path "$pkg\backend\tools"
          New-Item -ItemType Directory -Force -Path "$pkg\frontend\dist"
          New-Item -ItemType Directory -Force -Path "$pkg\data\extract_cache"
          New-Item -ItemType Directory -Force -Path "$pkg\data\thumb_cache"

          # Copy node.exe
          Copy-Item "node.exe" -Destination "$pkg\node.exe"

          # Copy compiled backend
          Copy-Item -Recurse "backend\dist\*" -Destination "$pkg\backend\dist\"

          # Copy backend production node_modules
          Copy-Item -Recurse "backend\node_modules\*" -Destination "$pkg\backend\node_modules\"

          # Copy tools (7zip, imagemagick, ffmpeg)
          Copy-Item -Recurse "backend\tools\*" -Destination "$pkg\backend\tools\"

          # Copy built frontend
          Copy-Item -Recurse "frontend\dist\*" -Destination "$pkg\frontend\dist\"

          # Copy env template for end users
          Copy-Item ".env.example" -Destination "$pkg\.env"

          # Create launcher bat
          @"
          @echo off
          chcp 65001 >nul
          title ShiguReader

          cd /d "%~dp0"

          echo Starting ShiguReader...
          echo [Tip] 如需设置资源目录，请编辑同目录 .env 中的 FS_QUICK_ACCESS
          start "" "http://localhost:8000"

          set SERVER_JS=
          if exist "backend\dist\server.js" set SERVER_JS=backend\dist\server.js
          if not defined SERVER_JS if exist "backend\dist\src\server.js" set SERVER_JS=backend\dist\src\server.js

          if not defined SERVER_JS (
              echo [ERROR] 找不到后端入口文件（已尝试 backend\dist\server.js 和 backend\dist\src\server.js）
              pause
              exit /b 1
          )

          node.exe --experimental-sqlite "%SERVER_JS%"
          pause
          "@ | Set-Content "$pkg\ShiguReader.bat" -Encoding UTF8

          # Copy README
          Copy-Item "README.md" -Destination "$pkg\README.md"

          # Create zip
          Compress-Archive -Path "$pkg" -DestinationPath "release_pkg\${pkgName}.zip" -Force
          Write-Host "Package created: release_pkg\${pkgName}.zip"

      - name: Upload package as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiguReader-${{ env.PACKAGE_VERSION }}-windows-x64
          path: release_pkg/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          name: ${{ env.PACKAGE_VERSION }}
          files: release_pkg/*.zip
          generate_release_notes: true
          body: |
            ## 安装说明

            1. 下载下方的 `ShiguReader-*-windows-x64.zip`
            2. 解压到任意目录（路径不要含中文）
            3. 编辑 `.env` 文件，填写您的漫画目录：`FS_QUICK_ACCESS=D:\你的漫画目录`
            4. 双击 `ShiguReader.bat` 启动，浏览器会自动打开

            **无需安装 Node.js 或任何其他软件。**
