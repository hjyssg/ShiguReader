## 问题分析

### 问题 2：MOVE_PLACE_DIR 后端完全没处理

后端 `settings.ts` 的问题很明确：
- `buildResponse()` 返回的字段里**没有** `move_place_dir`
- `updateSettings()` 的 Body 类型和处理逻辑里**没有** `move_place_dir`
- 但 `config.ts` 里定义了 `MOVE_PLACE_DIR`，前端 `settings.tsx` 和 `MoveDialog.tsx` 都在读写 `move_place_dir`

结果就是：前端设置页面修改 MOVE_PLACE_DIR 后，PUT 请求发了但后端直接忽略，GET 也永远不返回这个值。

### 问题 3：`/api/v1/fs/favorite-folder` 和 `/api/v1/fs/already-read-folder` 冗余

这两个端点做的事情就是读 `config.FAVORITE_DIR` / `config.ALREADY_READ_DIR`，检查目录是否存在，返回 `{ path, dirname }` 或 `null`。

而 `/api/v1/settings` 已经返回了 `favorite_dir` 和 `already_read_dir`。前端完全可以从 settings 接口获取这些值，不需要两个独立端点。

调用这两个端点的前端位置：
- `frontend/src/routes/_layout/index.tsx`（首页）
- `frontend/src/routes/_layout/read/index.tsx`（阅读页）
- `frontend/src/hooks/useFileOperations.ts`（文件操作 hooks）
- `frontend/src/client/sdk.gen.ts`（自动生成的 SDK）

---

## 修改方案

### 后端改动

1. **`backendnode/src/routes/settings.ts`**：
   - `buildResponse()` 加上 `move_place_dir: config.MOVE_PLACE_DIR || ""`
   - `updateSettings()` 的 Body 类型加上 `move_place_dir?: string | null`
   - 处理逻辑中加上 `MOVE_PLACE_DIR` 的 process.env 更新和 .env 持久化

2. **`backendnode/src/routes/fsDirectory.ts`**：删除 `getFavorite` 和 `getAlreadyRead` 两个 handler

3. **`backendnode/src/routes/fs.ts`**：删除 `/favorite-folder` 和 `/already-read-folder` 两个路由注册

### 前端改动

4. **`frontend/src/routes/_layout/index.tsx`**（首页）：
   - 删除对 `/api/v1/fs/favorite-folder` 和 `/api/v1/fs/already-read-folder` 的 query
   - 改为从 `/api/v1/settings` 获取 `favorite_dir` 和 `already_read_dir`，构造 `{ path, dirname }` 对象

5. **`frontend/src/routes/_layout/read/index.tsx`**（阅读页）：同上

6. **`frontend/src/hooks/useFileOperations.ts`**：
   - `moveToFavoriteMutation` 中把 `/api/v1/fs/favorite-folder` 改为从 `/api/v1/settings` 取 `favorite_dir`
   - `moveToAlreadyReadMutation` 中把 `/api/v1/fs/already-read-folder` 改为从 `/api/v1/settings` 取 `already_read_dir`

7. **`frontend/src/client/sdk.gen.ts`**：删除 `getFavoriteRoot()` 和 `getAlreadyReadRoot()` 方法（以及相关类型引用）

---

关于"目录是否存在"的检查：原来的独立端点会 `fs.stat` 验证目录存在才返回，去掉后前端拿到的是配置值，不保证目录存在。但实际上移动操作失败时本身就会报错，这个检查不是必须的。

